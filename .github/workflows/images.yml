name: Container Images

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        stack: [base, python, php]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install .
      - name: Render built-in stack
        env:
          STACK: ${{ matrix.stack }}
        run: |
          cd /tmp
          python - <<'PY'
          import os
          from pathlib import Path
          from agentbox.config import Config
          from agentbox.container import ContainerRuntime
          from agentbox.image import ImageBuilder
          builder = ImageBuilder(ContainerRuntime('docker'), Config(toolsets=['claude', os.environ['STACK']]))
          builder.plugin_manager.load(builder.config.toolsets)
          Path('/tmp/agentbox.Dockerfile').write_text(builder._render_dockerfile())
          PY
      - name: Build and smoke test
        env:
          STACK: ${{ matrix.stack }}
        run: |
          mkdir -p /tmp/agentbox-image-context
          docker build --pull --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t agentbox-check -f /tmp/agentbox.Dockerfile /tmp/agentbox-image-context
          docker run --rm agentbox-check claude --version
          docker run --rm agentbox-check git --version
          case "$STACK" in
            python) docker run --rm agentbox-check python3 --version ;;
            php) docker run --rm agentbox-check php --version; docker run --rm agentbox-check composer --version ;;
          esac
      - name: Record installed versions
        run: |
          mkdir reports
          docker run --rm --network=none agentbox-check rpm -qa --qf '%{NAME}\t%{VERSION}-%{RELEASE}\n' | sort > reports/rpm-packages.txt
          docker run --rm --network=none agentbox-check npm list -g --depth=0 --json > reports/npm-packages.json
          docker run --rm --network=none agentbox-check claude --version > reports/agent-version.txt
      - name: Install pinned scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true
      - name: Scan vulnerabilities and generate SBOM
        run: |
          trivy image --image-src docker --scanners vuln --list-all-pkgs --format json --output reports/vulnerabilities.json --timeout 10m agentbox-check
          trivy convert --format cyclonedx --output reports/sbom.cdx.json reports/vulnerabilities.json
          python - <<'PY'
          import json, os
          from collections import Counter
          from pathlib import Path
          data=json.loads(Path('reports/vulnerabilities.json').read_text())
          counts=Counter(v['Severity'] for result in data.get('Results', []) for v in result.get('Vulnerabilities', []))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('Vulnerability findings (report-only policy): '+str(dict(counts))+'\n')
          PY
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify candidate artifact
        id: candidate
        env:
          STACK: ${{ matrix.stack }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          unique="$image:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$STACK"
          docker tag agentbox-check "$unique"
          docker push "$unique"
          docker image rm "$unique"
          docker pull "$unique"
          docker run --rm "$unique" claude --version
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$image:$GITHUB_REF_NAME-$STACK"
          else
            tag="$image:$STACK"
          fi
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$unique")
          printf '%s\n' "$reference" > reports/image-digest.txt
          printf 'name=%s\ndigest=%s\ntag=%s\n' "$image" "${reference##*@}" "$tag" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.candidate.outputs.name }}
          subject-digest: ${{ steps.candidate.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest software bill of materials
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.candidate.outputs.name }}
          subject-digest: ${{ steps.candidate.outputs.digest }}
          sbom-path: reports/sbom.cdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Promote verified candidate
        env:
          PUBLISHED_TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          docker tag agentbox-check "$PUBLISHED_TAG"
          docker push "$PUBLISHED_TAG"
          printf '%s\n' "Published $PUBLISHED_TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Save image reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-reports-${{ matrix.stack }}
          path: reports/
          retention-days: 90
