name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Check formatting
        run: ruff format --check src/agentbox

      - name: Lint with ruff
        run: ruff check src/agentbox

      - name: Install package for type checking
        run: pip install -e ".[dev]"

      - name: Type check with mypy
        run: mypy src/agentbox

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      - name: Run tests with coverage
        run: pytest --cov=agentbox --cov-report=xml

      - name: Upload coverage to Codecov
        # External reporting must not cancel successful test jobs on network errors.
        continue-on-error: true
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  package:
    name: Build & Install Distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel from source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Verify clean wheel installation and bundled plugins
        run: |
          python -m venv /tmp/agentbox-package-check
          /tmp/agentbox-package-check/bin/pip install dist/*.whl
          cd /tmp
          /tmp/agentbox-package-check/bin/agentbox --version
          /tmp/agentbox-package-check/bin/agentbox toolset claude
          /tmp/agentbox-package-check/bin/agentbox toolset hermes
          /tmp/agentbox-package-check/bin/agentbox toolset kubernetes
