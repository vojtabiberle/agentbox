name: base
provides: ["git", "git-lfs", "tmux", "htop", "vim", "rg", "fd", "bat", "fzf", "jq", "yq", "ssh", "keychain", "gh", "node", "npm"]
description: Base development tools and Node.js
priority: 10

dockerfile: |
  # Base development tools
  RUN dnf install -y \
      git \
      tmux htop vim \
      ripgrep fd-find bat fzf \
      jq \
      openssh-clients \
      keychain \
      curl tar gzip \
      && dnf clean all

  # Release binaries still embed vulnerable Go stdlib/x/net; rebuild pinned sources.
  RUN set -eu; case "$(uname -m)" in \
      x86_64) arch=amd64; go_sha=ecbadb99091a3f46e31f5f934b068b1864eafa7995211b39eaddf76996045fe5 ;; \
      aarch64) arch=arm64; go_sha=94f3e30b8e374bc285e7dadc11e0865726b9bc6e85b841ccceaabc0214c6b7c8 ;; \
      *) echo "Unsupported architecture" >&2; exit 1 ;; esac; \
      mkdir /tmp/agentbox-tools; cd /tmp/agentbox-tools; \
      curl -fsSL "https://go.dev/dl/go1.27.2.linux-${arch}.tar.gz" -o go.tar.gz; \
      curl -fsSL https://codeload.github.com/git-lfs/git-lfs/tar.gz/refs/tags/v3.8.0 -o lfs.tar.gz; \
      curl -fsSL https://codeload.github.com/cli/cli/tar.gz/refs/tags/v2.102.0 -o gh.tar.gz; \
      curl -fsSL https://codeload.github.com/mikefarah/yq/tar.gz/refs/tags/v4.54.1 -o yq.tar.gz; \
      printf '%s  %s\n' "$go_sha" go.tar.gz \
          a12ecfc17ebee002d1f6acca79442029d41cbf5e5b4ba9e02249ed96de20300f lfs.tar.gz \
          08bf0ef8b4409893889175e0f5279d30d6edd96465816042c0d7c72eac598158 gh.tar.gz \
          0cec36e7035dd56c508bda56245cbd71e4495d2317bc2528165c4162bce79335 yq.tar.gz | sha256sum -c -; \
      for archive in go lfs gh yq; do tar -xzf "$archive.tar.gz"; done; \
      export PATH="/tmp/agentbox-tools/go/bin:$PATH" GOTOOLCHAIN=local CGO_ENABLED=0 \
          GOPATH=/tmp/agentbox-tools/gopath GOCACHE=/tmp/agentbox-tools/cache; \
      cd git-lfs-3.8.0; go get golang.org/x/net@v0.60.0; \
      go build -trimpath -o /usr/local/bin/git-lfs .; \
      cd ../cli-2.102.0; go get golang.org/x/net@v0.60.0; \
      go build -trimpath -ldflags '-X github.com/cli/cli/v2/internal/build.Version=2.102.0' -o /usr/local/bin/gh ./cmd/gh; \
      cd ../yq-4.54.1; go get golang.org/x/net@v0.60.0; \
      go build -trimpath -o /usr/local/bin/yq .; \
      git lfs install --system; \
      cd /; rm -rf /tmp/agentbox-tools

  # Pre-populate SSH known_hosts for common Git hosts
  # This prevents "authenticity of host" prompts during git operations
  RUN mkdir -p /home/user/.ssh && chmod 700 /home/user/.ssh \
      && ssh-keyscan -t ed25519,rsa github.com >> /home/user/.ssh/known_hosts 2>/dev/null \
      && ssh-keyscan -t ed25519,rsa gitlab.com >> /home/user/.ssh/known_hosts 2>/dev/null \
      && ssh-keyscan -t ed25519,rsa bitbucket.org >> /home/user/.ssh/known_hosts 2>/dev/null \
      && chmod 644 /home/user/.ssh/known_hosts \
      && chown -R user:user /home/user/.ssh

  # Node.js (required for Claude Code)
  RUN dnf install -y --setopt=install_weak_deps=False nodejs && dnf clean all
  # Bootstrap the complete patched npm bundle without keeping Fedora's older npm.
  RUN curl -fsSL https://registry.npmjs.org/npm/-/npm-11.19.1.tgz -o /tmp/npm.tgz \
      && echo '9f58bff01604cb1b14008fef14dceb14d836a49225e45c6c2e37de3be3e707f0  /tmp/npm.tgz' | sha256sum -c - \
      && mkdir -p /usr/local/lib/node_modules/npm \
      && tar -xzf /tmp/npm.tgz -C /usr/local/lib/node_modules/npm --strip-components=1 \
      && ln -s ../lib/node_modules/npm/bin/npm-cli.js /usr/local/bin/npm \
      && ln -s ../lib/node_modules/npm/bin/npx-cli.js /usr/local/bin/npx \
      && rm /tmp/npm.tgz \
      && npm --version
