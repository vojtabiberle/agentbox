name: cloud-azure
description: Azure CLI support
depends_on:
  - base
priority: 80

dockerfile: |
  # Azure CLI
  RUN rpm --import https://packages.microsoft.com/keys/microsoft.asc \
      && dnf install -y https://packages.microsoft.com/config/rhel/9/packages-microsoft-prod.rpm 2>/dev/null || true \
      && dnf install -y azure-cli \
      && dnf clean all

mounts:
  - source: ~/.azure
    target: /home/user/.azure
    readonly: true
    description: Azure CLI credentials and config
